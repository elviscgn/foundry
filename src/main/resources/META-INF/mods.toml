modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
mandatory=true
versionRange="[6.0.8,6.1.0)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="createoreexcavation"
mandatory=true
versionRange="${create_ore_excavation_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tectonic"
mandatory=true
versionRange="${tectonic_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="structurize"
mandatory=false
versionRange="[1.0.742,)"
ordering="AFTER"
side="BOTH"
