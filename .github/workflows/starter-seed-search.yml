name: Starter Seed Search

on:
  push:
    branches:
      - feature/compact-worldgen

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept development-server EULA
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt

      - name: Search real Foundry/Tectonic starter seeds
        run: |
          chmod +x gradlew
          # Let Forge finish loading, launch the deterministic scanner, then give it a generous
          # window to score the real Tectonic terrain/biomes before shutting the dev server down.
          ( sleep 45; echo 'foundry starterseed 8000'; sleep 600; echo 'stop' ) \
            | timeout 900s ./gradlew runServer -PfoundryJourneyMap=false --console=plain
