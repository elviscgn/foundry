plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

def enableVulkan = (project.findProperty('foundryVulkan') ?: 'false').toString().toBoolean()
def enableJourneyMap = !(project.findProperty('foundryJourneyMap') ?: 'true').toString().equalsIgnoreCase('false')

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            // DEBUG + REGISTRIES logging creates a surprising amount of console I/O on macOS.
            // Keep normal runs quiet; temporarily restore debug logging only when diagnosing Forge registration.
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            arg '-mixin.config=foundry.mixins.json'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

mixin {
    add sourceSets.main, 'foundry.refmap.json'
    config 'foundry.mixins.json'
}

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/mirror' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    maven { url = 'https://www.cursemaven.com' }

    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        forRepositories(fg.repository)
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim")) {
        transitive = false
    }
    implementation fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_version}"))
    implementation "io.github.llamalad7:mixinextras-forge:${mixin_extras_version}"

    // Intuitive ore surveying and Create-powered extraction. Foundry forces finite reserves at runtime.
    implementation fg.deobf("maven.modrinth:ResbpANg:${create_ore_excavation_version}")

    // Tectonic owns terrain shape; Continents owns the organic source geography. Foundry clamps the
    // finished live Overworld NoiseRouter in code so neither datapack order nor Lithostitched can bypass it.
    implementation fg.deobf("curse.maven:tectonic-686836:${tectonic_file_id}")
    implementation fg.deobf("curse.maven:continents-682515:${continents_file_id}")

    // Low-risk performance stack. None of these replaces Create/Flywheel's renderer.
    runtimeOnly fg.deobf("curse.maven:ferritecore-429235:${ferritecore_file_id}")
    runtimeOnly fg.deobf("curse.maven:modernfix-790626:${modernfix_file_id}")
    runtimeOnly fg.deobf("maven.modrinth:5ZwdcRci:${immediatelyfast_version}")

    // Fullscreen terrain map for worldgen iteration. Disable for clean FPS A/B tests with
    // -PfoundryJourneyMap=false, because live mapping itself costs CPU/GPU/chunk I/O.
    if (enableJourneyMap) {
        runtimeOnly fg.deobf("curse.maven:journeymap-32274:${journeymap_file_id}")
    }

    // Experimental Apple Silicon A/B renderer profile. VulkanMod uses a completely different renderer;
    // keep it opt-in because Create/Flywheel/maps can depend on OpenGL-specific behavior.
    if (enableVulkan) {
        runtimeOnly fg.deobf("curse.maven:vulkanmod-unofficial-forge-port-1591477:${vulkanmod_file_id}")
    }

    // Blueprint/urban-construction engine available in the dev runtime for Foundry development plots.
    runtimeOnly fg.deobf("curse.maven:structurize-298744:8610456")
    runtimeOnly fg.deobf("curse.maven:blockui-522992:6646544")
    runtimeOnly fg.deobf("curse.maven:domum-ornamentum-527361:7585567")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            create_ore_excavation_version_range: create_ore_excavation_version_range,
            tectonic_version_range: tectonic_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'foundry.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
