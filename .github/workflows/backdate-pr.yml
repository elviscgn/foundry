name: Backdate PR commits

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: read

jobs:
  backdate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.review.user.login == github.repository_owner &&
      github.event.review.state == 'commented'
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Move today's author dates to yesterday
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TZ: Africa/Johannesburg
        run: |
          set -euo pipefail

          git fetch origin "$BASE_REF"
          BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          TODAY=$(date +%F)
          YESTERDAY=$(date -d 'yesterday' +%F)
          export TODAY YESTERDAY

          NEEDS_BACKDATE="no"
          while read -r author_date; do
            if [ "$(date -d "$author_date" +%F)" = "$TODAY" ]; then
              NEEDS_BACKDATE="yes"
              break
            fi
          done < <(git log "$BASE"..HEAD --format='%aI')

          if [ "$NEEDS_BACKDATE" != "yes" ]; then
            echo "No commits authored today; nothing to rewrite."
            exit 0
          fi

          git rebase --rebase-merges --exec '
            author_date=$(git show -s --format=%aI HEAD)
            author_day=$(date -d "$author_date" +%F)
            if [ "$author_day" = "$TODAY" ]; then
              local_time=$(date -d "$author_date" +%T)
              target="${YESTERDAY}T${local_time}+02:00"
              committer_name=$(git show -s --format=%cn HEAD)
              committer_email=$(git show -s --format=%ce HEAD)
              GIT_COMMITTER_NAME="$committer_name" \
              GIT_COMMITTER_EMAIL="$committer_email" \
              GIT_COMMITTER_DATE="$target" \
                git commit --amend --no-edit --date="$target"
            fi
          ' "$BASE"

          git push --force-with-lease origin "HEAD:$HEAD_REF"
