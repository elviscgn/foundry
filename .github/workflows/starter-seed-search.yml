name: Starter Seed Search

on:
  push:
    branches:
      - feature/compact-worldgen

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Exercise continuous starter-seed CLI
        run: |
          chmod +x gradlew
          # The task creates its isolated EULA, disables JourneyMap, boots the real dedicated
          # Forge/Tectonic/COE runtime, and searches continuously. Cap CI runtime; local runs may
          # continue until a qualifying seed is found.
          timeout 900s ./gradlew starterSeedSearch --console=plain
