# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.23
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Create 6.0.8 development dependencies
create_version=6.0.8-289
ponder_version=1.0.91
flywheel_version=1.0.5
registrate_version=MC1.20-1.3.3
mixin_extras_version=0.4.1

## Create Ore Excavation surveying/extraction dependency
create_ore_excavation_version=9mCy0ePP
create_ore_excavation_version_range=[1.6.5,1.7.0)

## Stable Tectonic terrain/worldgen dependency for Forge 1.20.1
tectonic_file_id=5676419
tectonic_version_range=[2.4.1,2.4.2)

## Continents provides the macro landmass/island layout that Tectonic explicitly integrates with.
continents_file_id=4631020

## JourneyMap is a development/runtime terrain inspection tool. Stable Forge 1.20.1 release 5.10.3.
journeymap_file_id=5789363

## Conservative performance stack for the dev runtime.
## FerriteCore reduces memory pressure; ModernFix reduces startup/runtime overhead.
## ImmediatelyFast batches immediate-mode rendering without replacing Create/Flywheel's renderer.
ferritecore_file_id=4810975
modernfix_file_id=8696268
immediatelyfast_version=ZhW5WW22

## Optional Vulkan renderer A/B profile for Apple Silicon.
## Not enabled by default because Create/Flywheel/JourneyMap use custom rendering paths.
## Test with: ./gradlew runClient -PfoundryVulkan=true
vulkanmod_file_id=8353060

